services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runningweb_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: runningweb_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: runningweb_v2
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Este script se ejecuta SOLO la primera vez que se crea el volumen
      - ./runningweb_v2-con-datos-de-prueba.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: runningweb_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
